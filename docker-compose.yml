version: "3.9"

services:
  nammongodb:
    image: mongo:7
    container_name: nammongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: product-api
    volumes:
      - mongo-data:/data/db
    networks:
      - product-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  product-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: product-api:local
    container_name: product-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://nammongodb:27017/product-api
    ports:
      - "3000:3000"
    depends_on:
      nammongodb:
        condition: service_healthy
    networks:
      - product-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  product-net:
    driver: bridge

volumes:
  mongo-data:
