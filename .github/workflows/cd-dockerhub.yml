name: cd-dockerhub
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_local:
        description: Deploy verified image on the registered local Windows runner
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: product-api-release
  cancel-in-progress: false
jobs:
  verify-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MONGO_URI: mongodb://localhost:27017/product-api-test-cd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - name: Build and verify the exact image to publish
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180
          curl -fsS http://localhost:3000/api/health
      - id: meta
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "can_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Skipping Docker Hub publish because DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not configured."
            echo "can_push=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        if: steps.dockerhub.outputs.can_push == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the already-tested image (no rebuild)
        if: steps.dockerhub.outputs.can_push == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker tag product-api:local "$DOCKERHUB_USERNAME/product-api:$IMAGE_TAG"
          docker tag product-api:local "$DOCKERHUB_USERNAME/product-api:latest"
          docker push "$DOCKERHUB_USERNAME/product-api:$IMAGE_TAG"
          docker push "$DOCKERHUB_USERNAME/product-api:latest"
      - if: always()
        run: docker compose logs --no-color --tail 100
      - if: always()
        run: docker compose down
  deploy-local:
    needs: verify-and-push
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.deploy_local) || vars.ENABLE_LOCAL_CD == 'true')
    runs-on: [self-hosted, Windows, p1-deploy]
    timeout-minutes: 15
    environment: local-demo
    steps:
      - uses: actions/checkout@v4
      - name: Pull verified image and deploy on local Docker Engine
        shell: pwsh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.verify-and-push.outputs.tag }}
        run: |
          $env:DOCKERHUB_TOKEN | docker login --username $env:DOCKERHUB_USERNAME --password-stdin
          if ($LASTEXITCODE -ne 0) { throw 'Docker Hub login failed' }
          ./scripts/deploy-local.ps1
