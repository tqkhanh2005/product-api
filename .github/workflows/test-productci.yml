name: test-productci

# Simple CI: install deps, lint, run the mocked unit-test suite.
# No external dependencies required — this is the "basic" test workflow
# requested in Prompt 1, item 10.

on:
  push:
    branches: [main, develop]
    paths:
      - "phase1-product-api/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "phase1-product-api/**"

defaults:
  run:
    working-directory: phase1-product-api

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: phase1-product-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run unit tests (mocked persistence layer)
        run: npm test
