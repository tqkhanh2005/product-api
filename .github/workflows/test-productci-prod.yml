name: test-productci-prod

# Production-representative CI: runs the full CRUD suite against a REAL
# MongoDB service container provided by GitHub Actions (not a mock),
# then boots the API for real and checks /api/health.
# Requested in Prompt 1, item 11.

on:
  push:
    branches: [main]
    paths:
      - "phase1-product-api/**"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: phase1-product-api

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_URI: mongodb://localhost:27017/product-api-test
      PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: phase1-product-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run CRUD integration tests against real MongoDB
        run: npm run test:integration

      - name: Boot the real API and verify /api/health
        run: |
          node src/server.js &
          APP_PID=$!
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/api/health | grep -q '"status":"UP"'; then
              echo "Healthcheck OK"
              kill $APP_PID
              exit 0
            fi
            echo "Waiting for API to be healthy... ($i)"
            sleep 2
          done
          echo "Healthcheck FAILED"
          kill $APP_PID || true
          exit 1
